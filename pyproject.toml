[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-home-ai"
version = "3.0.0-pc"
description = "Offline-first Nova Home AI desktop assistant for Windows PCs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
