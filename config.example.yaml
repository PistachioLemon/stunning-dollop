app:
  name: RequantAi Dispatcher
  host: 0.0.0.0
  port: 8787
  timezone: America/Los_Angeles
  simulation: true
  data_dir: ./data
runtime:
  profile: cpu_minimum
  accelerator: none
  require_accelerator: false
local_llm:
  enabled: false
  server_url: http://127.0.0.1:8080
  model_path: ./models/trucklm-small.gguf
  timeout_seconds: 45
  max_tokens: 256
  temperature: 0.2
learning:
  enabled: true
  auto_training_enabled: false
  training_timezone: America/Los_Angeles
  training_hour: 1
  training_minute: 0
  occurrence_lookback_hours: 24
  auto_select_event_types: [repair_success, repair_failure, dispatch_decision, load_exception, receiving_exception, driver_correction, operator_teach]
  auto_promote_model: false
telemetry:
  simulation: true
  mqtt_enabled: false
  gps_enabled: true
  can_enabled: false
  obd_enabled: false
  reefer_enabled: false
  load_sensors_enabled: false
  cargo_vision_enabled: false
